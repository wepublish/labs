# SUPERSEDED (2026-06-11, single-gateway routing decision — see ../../README.md):
# per-newsroom profiles are no longer instantiated. One Slack app = one gateway, so
# the `internal` profile (Aldus) serves all channels; newsroom scoping happens via
# RAGFLOW_CHANNEL_MAP in the kb-retrieve/kb-ingest skills. This directory is RETAINED
# for its editorial wording (SOUL.md) — fold into the unified SOUL when a newsroom
# channel goes live.

model:
  provider: openrouter
  default: anthropic/claude-haiku-4.5

platforms:
  slack:
    reply_to_mode: "first"
    extra:
      reply_in_thread: true
      reply_broadcast: false

mcp_servers:
  # Read-only CMS diagnostics for THIS newsroom's deployment only
  # (single-newsroom mode: the MCP instance/config pins the upstream API URL + token)
  cms:
    url: "${CMS_MCP_URL}"
    headers:
      Authorization: "Bearer ${CMS_MCP_AUTH_TOKEN}"
    tools:
      include: [cms_check_payment_setup, cms_check_subscription_setup]
